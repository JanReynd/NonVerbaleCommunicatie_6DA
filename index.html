function scenarioCorrect(i){const arr=state.interpretations[i]||[];return state.observations[i]===scenarios[i].oa&&arr.length===scenarios[i].answers.length&&scenarios[i].answers.every(a=>arr.includes(a));}
function updateChrome(){const done=completed(),n=done.filter(Boolean).length;document.getElementById('steps').innerHTML=titles.map((t,i)=>`<button class="step ${done[i]?'done':''}" data-nav="${i}" ${state.page===i?'aria-current="step"':''} aria-label="${i+1}. ${t}${done[i]?', afgerond':''}"><span class="step-no" aria-hidden="true">${done[i]?'✓':i+1}</span>${t}</button>`).join('');document.getElementById('progress-text').textContent=`${n} van 6 afgerond`;document.getElementById('progress-fill').style.width=`${n/6*100}%`;document.querySelector('.meter').setAttribute('aria-valuenow',n);document.getElementById('save-state').innerHTML=`<span class="save-dot"></span>${storageOK?'Voortgang bewaard op dit apparaat':'Voortgang alleen tijdens deze sessie'}`;}
function say(s){const el=document.getElementById('announcer');el.textContent='';requestAnimationFrame(()=>{el.textContent=s;});}
function render(){const focused=document.activeElement?.id;main.innerHTML=[renderStart,renderDiscover,renderMatch,renderFill,renderInterpret,renderExit][state.page]();updateChrome();if(focused&&document.getElementById(focused))document.getElementById(focused).focus({preventScroll:true});}
function navigate(i){state.page=i;save();render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.querySelector('.step[aria-current]')?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});}
function pageHead(n,title,desc){return `<div class="page-head"><div class="eyebrow">${String(n+1).padStart(2,'0')} / ${titles[n]}</div><h1>${title}</h1><p class="lede">${desc}</p></div>`;}
function next(n,text){return `<div class="nextrow"><p>${text}</p><button class="btn" data-nav="${n}">Verder naar ${titles[n].toLowerCase()} ${icon('arrow')}</button></div>`;}
function feed(text,kind='good',title='Goed gezien.'){return `<div class="feedback ${kind}" role="status"><strong>${title}</strong>${text}</div>`;}
function choices(opts,action,key,selected,correct=null,multi=false){return `<div class="choice-list">${opts.map((t,i)=>`<button id="${action}-${key}-${i}" class="choice ${multi?'multi':''} ${(multi?selected?.includes(i):selected===i)?'selected':''} ${correct===i?'correct':''}" data-action="${action}" data-key="${key}" data-value="${i}" aria-pressed="${multi?!!selected?.includes(i):selected===i}"><span class="dot" aria-hidden="true"></span><span>${esc(t)}</span></button>`).join('')}</div>`;}
function renderStart(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Meer zien dan woorden</div><h1>Je lichaam<br>praat <em>mee.</em></h1><p class="lede">Een blik. Een gebaar. Een stilte.<br>Ontdek wat ze doen in een gesprek — en hoe je ze zorgvuldig interpreteert.</p><div class="actions"><button class="btn" data-action="jump-start">Doe de eerste indruk ${icon('arrow')}</button></div><div class="hero-meta"><span>◷ &nbsp;45–50 minuten</span><span>8 functies</span><span>Jouw tempo</span></div></div><div class="hero-art">${heroArt()}</div></section>
<div class="strategy"><span class="icon">${icon('eye')}</span><div class="nodes"><span><b>01</b> Wat zie of hoor je?</span><i>→</i><span><b>02</b> Wat kan dat betekenen?</span><i>→</i><span><b>03</b> Welke context heb je?</span></div></div>
<section class="section" id="first-impression"><div class="sectionhead"><div><h2>Eerste indruk. Tweede gedachte.</h2><p>Een korte opwarmer. Je krijgt zo meer informatie.</p></div><span class="pill">± 3 min</span></div><div class="panel grid2"><figure class="scene"><span class="scene-label">Wat denk jij?</span>${person('cold')}<figcaption>Alex zit met de armen over elkaar tijdens een gesprek.</figcaption></figure><div><h3>Wat betekent deze houding?</h3><p class="muted small" style="margin-top:10px">Kies je eerste inschatting. We beoordelen hier geen score.</p>${choices(['Alex is vast boos.','Alex heeft het misschien koud.','Met alleen deze houding weet ik het nog niet.'],'start',0,state.startChoice)}<div class="actions"><button class="btn secondary" id="reveal-context" data-action="reveal" ${state.startChoice===null?'disabled':''}>${state.revealed?'Context bekijken':'Onthul de context'} ${icon('eye')}</button></div>${state.revealed?feed('Het raam staat open en Alex zegt: “Ik heb het echt koud.” De extra informatie maakt kou een aannemelijke verklaring. Een houding alleen is onvoldoende om iemands gevoel zeker te kennen.','', 'De context verandert je blik.') : ''}</div></div></section>
<section class="section grid3"><div class="panel mini"><div class="icon-tile">${icon('eye')}</div><h3>Herken signalen</h3><p class="muted small" style="margin-top:12px">Ontdek wat je lichaam en je stem aan een gesprek toevoegen.</p></div><div class="panel mini"><div class="icon-tile">${icon('book')}</div><h3>Leg de functie uit</h3><p class="muted small" style="margin-top:12px">Leer de acht functies herkennen aan hun rol in de situatie.</p></div><div class="panel mini"><div class="icon-tile">${icon('spark')}</div><h3>Denk een stap verder</h3><p class="muted small" style="margin-top:12px">Onderbouw je interpretatie. Soms passen meerdere functies.</p></div></section>${next(1,'Je mag altijd terugkijken. Bovenaan zie je welke onderdelen je hebt afgerond.')}`;}
function renderDiscover(){return pageHead(1,'Niet alleen wát je zegt.','Woorden vertellen iets. Je lichaam en je stem doen mee. Ontdek eerst de signalen, daarna de acht functies.')+`<div class="grid2"><section class="panel channel"><div class="icon-tile">${icon('body')}</div><h2>Lichaamstaal</h2><p class="muted" style="margin-top:12px">Wat je aan het lichaam kunt zien.</p><div class="terms">${['Gebaren','Houding','Mimiek','Blik','Oogcontact','Afstand'].map(w=>`<button class="term" data-word="${w}">${w}</button>`).join('')}</div></section><section class="panel channel"><div class="icon-tile">${icon('voice')}</div><h2>Stemtaal</h2><p class="muted" style="margin-top:12px">Hoe woorden klinken en hoe je spreekt.</p><div class="terms">${['Klemtoon','Intonatie','Spreeksnelheid','Pauzes','Stemvolume'].map(w=>`<button class="term" data-word="${w}">${w}</button>`).join('')}</div></section></div>
<section class="section"><div class="sectionhead"><div><h2>Acht functies. Eén gesprek.</h2><p>Open elke kaart en beantwoord de korte controlevraag.</p></div><span class="count">${Object.values(state.learn).filter(Boolean).length} / 8 verkend</span></div><div class="function-grid">${functionsData.map((f,i)=>`<details class="function" data-learn="${i}" ${state.learnOpen===i?'open':''}><summary id="learn-summary-${i}"><span class="symbol">${state.learn[i]?'✓':f.symbol}</span><span><b>${f.name}</b><small>${f.short}</small></span></summary><div class="function-body"><p class="small">${f.def}</p><div class="example">${f.ex}</div><p class="microq">${f.q}</p>${choices(f.options,'learn',i,state.learnChoice[i])}${state.learnChoice[i]!==undefined?(state.learnChoice[i]===f.answer?feed(f.why):feed(f.hint,'hint','Denk nog even verder.')):''}</div></details>`).join('')}</div></section>
<div class="feedback"><strong>Een functie is wat een signaal dóét in dit gesprek.</strong>Een knik kan een woord vervangen, een antwoord herhalen of laten merken dat je luistert. Kijk dus telkens naar de woorden en de situatie. Persoonlijke gewoonten en culturele context kunnen ook meespelen.</div>${next(2,'Tip: gebruik de woordenwijzer als een begrip nog nieuw voor je is.')}`;}
function renderMatch(){const start=state.round*4,ids=[start,start+1,start+2,start+3],targetOrder=state.round===0?[7,0,6,3]:[5,1,4,2];return pageHead(2,'Vind de juiste match.','Welke functie staat in deze situatie op de voorgrond? Klik eerst op een situatie en daarna op de passende functie.')+`<section class="panel"><div class="sectionhead"><div class="rounds">${[0,1].map(i=>`<button id="round-${i}" data-action="round" data-value="${i}" aria-pressed="${state.round===i}">Ronde ${i+1}${[0,1,2,3].every(j=>state.matched.includes(i*4+j))?' ✓':''}</button>`).join('')}</div><span class="count">${state.matched.length} / 8 gekoppeld</span></div><div class="match-layout"><div class="match-column"><div class="match-label">1. Kies een situatie</div>${ids.map(i=>`<button id="match-case-${i}" class="match-case ${selectedMatch===i?'selected':''} ${state.matched.includes(i)?'solved':''}" data-action="match-case" data-value="${i}" aria-pressed="${selectedMatch===i}" ${state.matched.includes(i)?'disabled':''}><span class="step-no">${state.matched.includes(i)?'✓':i+1}</span><span>${matches[i].text}${state.matched.includes(i)?`<small>${functionsData[matches[i].f].name}</small>`:''}</span></button>`).join('')}</div><div class="match-column"><div class="match-label">2. Kies de functie</div>${targetOrder.map(f=>{const solved=ids.some(i=>matches[i].f===f&&state.matched.includes(i));return `<button id="match-target-${f}" class="match-target ${solved?'solved':''}" data-action="match-target" data-value="${f}" ${solved?'disabled':''}>${solved?'✓ &nbsp;':''}${functionsData[f].name}</button>`;}).join('')}</div></div>${matchFeedback||'<p class="small muted" style="margin-top:20px">Je kunt je geselecteerde situatie veranderen voordat je een functie kiest.</p>'}${ids.every(i=>state.matched.includes(i))?feed(state.round===0?'De eerste vier zijn gekoppeld. Ga naar ronde 2 voor de andere functies.':'Je hebt deze ronde voltooid. Je kunt alle koppelingen nog eens nalezen.') : ''}${state.round===0&&ids.every(i=>state.matched.includes(i))?'<div class="actions"><button class="btn" data-action="round" data-value="1">Naar ronde 2 →</button></div>':''}</section>${next(3,'Herhalen = dezelfde boodschap erbij. Vervangen = het gebaar neemt de plaats van woorden in.')}`;}
function renderFill(){const d=dialogue[state.dialogueActive],di=state.dialogueActive;return pageHead(3,'Geef de signalen een naam.','Eerst de begrippen, dan een echt gesprek. De dialoog is bewerkt op basis van de oefening in de bundel.')+`<section class="panel"><div class="sectionhead"><div><h2>Vul de lege plekken aan.</h2><p>Kies in elk invulvak het passende woord uit de woordenbank.</p></div><span class="pill">Oefening 1</span></div><div class="wordbank" aria-label="Woordenbank">${gapBank.map(w=>`<span>${w}</span>`).join('')}</div>${gaps.map((g,i)=>`<div class="gaprow"><label for="gap-${i}"><b>${i+1}.</b> ${g.pre} <select id="gap-${i}" data-gap="${i}" aria-label="Invulvak ${i+1}" ${state.gapChecked?`aria-describedby="gap-hint-${i}"`:''}><option value="">Kies een woord</option>${gapBank.map(w=>`<option value="${w}" ${state.gaps[i]===w?'selected':''}>${w}</option>`).join('')}</select> ${g.post}</label>${state.gapChecked?`<small id="gap-hint-${i}" class="${state.gaps[i]===g.word?'correct-note':'hint-note'}">${state.gaps[i]===g.word?'✓ Juist.':`↗ ${state.gaps[i]?'Probeer opnieuw.':'Vul dit vak nog in.'}`} ${g.hint}</small>`:''}</div>`).join('')}<div class="actions"><button class="btn" id="check-gaps" data-action="check-gaps">Controleer mijn antwoorden ${icon('check')}</button>${state.gapChecked?`<span class="count">${gaps.filter((g,i)=>state.gaps[i]===g.word).length} / 8 correct</span>`:''}</div></section>
<section class="section"><div class="sectionhead"><div><h2>Lees tussen de regels.</h2><p>Klik op de vijf gemarkeerde gedragingen en onderzoek hun functie.</p></div><span class="count">${Object.values(state.dialogue).filter(Boolean).length} / 5 onderzocht</span></div><div class="grid2"><div class="panel dialogue"><div class="speech"><span class="who">Moeder</span>“Hoe ging je examen? Ik hoorde dat er leerlingen betrapt zijn op spieken.”</div><div class="speech child"><span class="who">Dochter</span>“Nee, ik heb niet gespiekt.”${gestureBtn(0,'Ze schudt tegelijk haar hoofd.')}${gestureBtn(4,'Bij de vraag kijkt ze even naar de vloer.')}</div><div class="speech"><span class="who">Moeder</span>“Ik wil eerst even uitleggen wat ik gehoord heb.”${gestureBtn(1,'Ze heft haar hand op om haar dochter nog niet te laten antwoorden.')}</div><div class="speech child"><span class="who">Dochter</span>“Ik heb misschien toch even op het blad naast mij gekeken.” Ze begint te huilen.</div><div class="speech"><span class="who">Moeder</span>${gestureBtn(2,'Ze legt troostend een arm om haar dochter heen om medeleven te uiten.')}“Ik wil dat je eerlijk bent. Daarna zoeken we samen een oplossing.”</div><div class="speech child"><span class="who">Dochter</span>${gestureBtn(3,'Ze knikt af en toe terwijl moeder verder uitlegt, om te tonen dat ze de uitleg volgt.')}</div></div><div class="analysis-card" id="dialogue-question"><div class="eyebrow">Onderzoek het gedrag</div><h3>${d.title}</h3><p class="small">${d.quote}</p><p class="microq">Welke uitleg past hier het best?</p>${choices(d.options,'dialogue',di,state.dialogueChoice[di])}${dialogueFeedback||(state.dialogue[di]?feed(d.why):'')}<p class="small muted" style="margin-top:20px">Let op: we beoordelen wat de gebaren in de beschreven situatie doen.</p></div></div></section>${next(4,'Een waarneembaar signaal is nog geen zekere verklaring. Dat oefen je in de volgende stap.')}`;}
function gestureBtn(i,text){return `<button id="gesture-${i}" class="gesture ${state.dialogue[i]?'done':''}" data-action="gesture" data-value="${i}" aria-pressed="${state.dialogueActive===i}">${state.dialogue[i]?'✓':'↗'} ${text}</button>`;}
function renderInterpret(){const i=state.scenario,s=scenarios[i],ok=state.scenarioChecked[i]&&scenarioCorrect(i);return pageHead(4,'Kijk. Denk. Onderbouw.','Ga van een observatie naar een mogelijke betekenis. Kies wat de context ondersteunt, en vul geen gedachten van anderen in.')+`<section class="panel"><div class="sectionhead"><div class="rounds">${scenarios.map((_,n)=>`<button id="scenario-${n}" data-action="scenario" data-value="${n}" aria-pressed="${i===n}">Situatie ${n+1}${state.scenarioChecked[n]&&scenarioCorrect(n)?' ✓':''}</button>`).join('')}</div></div><div class="scenario-grid"><div class="scenario-visual"><span class="scene-label">${s.label}</span>${person(s.art,i===1?'#9aaf4e':'#6744ca',i===1?'#ad714e':'#dfac8a')}<h3>${s.name}</h3><p>${s.text}</p></div><div><div class="question-group"><p>1. Wat kun je rechtstreeks zien of horen?</p>${choices(s.obs,'observation',i,state.observations[i])}</div><div class="question-group"><p>2. Welke functie en onderbouwing passen?</p>${s.answers.length>1?'<p class="small muted" style="margin-top:6px">Kies de twee passende antwoorden.</p>':''}${choices(s.options,'interpretation',i,s.answers.length>1?(state.interpretations[i]||[]):state.interpretations[i]?.[0],null,s.answers.length>1)}<div class="actions"><button id="check-scenario" class="btn" data-action="check-scenario">Controleer mijn redenering ${icon('check')}</button></div>${scenarioFeedback||(ok?feed(s.why):'')}</div></div></div>${ok&&i<2?`<div class="actions"><button class="btn secondary" data-action="scenario" data-value="${i+1}">Volgende situatie →</button></div>`:''}</section>
<div class="feedback"><strong>Context vóór conclusie.</strong>Een gesloten houding, wegkijken of zenuwachtig bewegen bewijst op zichzelf niet dat iemand liegt. Formuleer voorzichtig: “Dit zou kunnen betekenen …” en vraag waar nodig door.</div>
<details class="optional"><summary>Extra kijkopdracht · De Wonderjaren</summary><div><p>Deze uitbreiding sluit aan bij de kijkopdrachten uit de bundel. De hoofdroute kun je zonder video afronden. Voor het fragment kan toegang via school nodig zijn.</p><p><a href="https://onderwijs.hetarchief.be/item/4j09w48c9j" target="_blank" rel="noopener">Open het fragment in Het Archief voor Onderwijs ↗</a></p><h3>Kijk van 4:24 tot 9:30</h3><ol><li>Beschrijf één gebaar of gezichtsuitdrukking van Élodie Ouédraogo. Noteer ook wat ze op dat moment zegt.</li><li>Welke functie past? Leg uit hoe de woorden en het gebaar samenhangen.</li><li>Zoek een luisterreactie van Siska Schoeters of Binu Singh. Is die vooral feedback, of stuurt ze het gesprek?</li></ol><details><summary>Vergelijk met de voorbeelden uit de bundel</summary><p style="margin-top:12px">De bundel noemt onder meer het vergroten van de ogen om woorden te accentueren, hummen als luisterfeedback en een “pokerface” die een omschrijving vervangt. Een stille reactie van verbazing kan tegelijk vervangend én emotioneel zijn. Onderbouw met wat je in het fragment daadwerkelijk ziet en hoort.</p></details><h3>Verder denken · 14:40 tot 17:20</h3><p>Vergelijk de inschattingen over welk kind liegt. Welke signalen worden genoemd? Bespreek waarom die signalen geen sluitend bewijs zijn. Beoordeel de onderbouwing, niet hoe goed je kunt gokken.</p></div></details>
<details class="optional"><summary>Verdieping · Wat weet de ander?</summary><div><p><b>Theory of mind</b> is het begrijpen dat anderen eigen gedachten, kennis en overtuigingen hebben. Die kunnen van de jouwe verschillen en zelfs onjuist zijn.</p><p>Voorbeeld: jij ziet dat een boek wordt verplaatst terwijl je vriend buiten is. Jij weet waar het nu ligt; je vriend heeft die informatie nog niet. Dat gaat om verschillende kennis, niet alleen om fantasie en werkelijkheid.</p><p>Deze vaardigheden ontwikkelen geleidelijk. De stellige regel dat kinderen tot drie jaar niet kunnen liegen is te eenvoudig: onderzoek vond al eenvoudige onware ontkenningen bij sommige tweejarigen. Een leugen consequent volhouden is een andere, moeilijkere vaardigheid.</p><p class="small"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3788848/" target="_blank" rel="noopener">Onderzoek: Evans & Lee, Emergence of Lying in Very Young Children (2013) ↗</a></p></div></details>${next(5,'Klaar voor nieuwe voorbeelden? In het exit ticket zie je de feedback pas na het indienen.')}`;}
function renderExit(){if(state.result)return renderResult();return pageHead(5,'Wat neem je mee?','Vijf vragen en één korte reflectie. Pas toe wat je geleerd hebt. Je krijgt je score en feedback na het indienen.')+`<div class="quiz-layout"><form class="panel" id="exit-form" novalidate>${quiz.map((q,i)=>`<fieldset class="quiz-question"><legend><span>0${i+1}</span>${q.q}</legend><div class="choice-list">${q.o.map((o,j)=>`<label class="radio-choice"><input type="radio" name="quiz-${i}" value="${j}" ${state.quizAnswers[i]===j?'checked':''}><span>${o}</span></label>`).join('')}</div></fieldset>`).join('')}<div class="question-group" style="margin-top:25px"><label for="reflection"><b>06 &nbsp; Jouw reflectie</b><br>Een klasgenoot kijkt weg voordat die antwoordt. Welke extra informatie zou jij vragen voordat je dat gedrag interpreteert?</label><textarea id="reflection" maxlength="1200" placeholder="Ik zou vragen … omdat …">${esc(state.reflection)}</textarea><p class="small muted">Eén of twee zinnen. Je vergelijkt je antwoord straks zelf met een voorbeeld; deze vraag telt niet mee voor de score.</p></div>${quizError?feed(quizError,'hint','Nog even aanvullen.'):''}<div class="actions"><button class="btn lime" type="submit">Dien mijn exit ticket in ${icon('arrow')}</button></div></form><aside class="aside-note"><div class="icon-tile">${icon('spark')}</div><h3>Laat zien wat je kunt.</h3><ul><li>Herken lichaamstaal en stemtaal.</li><li>Onderscheid functies die op elkaar lijken.</li><li>Kijk naar de context.</li><li>Onderbouw je interpretatie.</li></ul><p class="small" style="margin-top:20px">Je resultaat blijft op dit apparaat. Na afloop kun je het afdrukken of via het afdrukvenster als pdf bewaren.</p></aside></div>`;}
function renderResult(){const r=state.result,correct=quiz.map((q,i)=>r.answers[i]===q.a),score=correct.filter(Boolean).length,secure=score>=4&&correct[4];const weak=quiz.filter((_,i)=>!correct[i]);return pageHead(5,'Jouw exit ticket.','Bekijk wat al lukt en wat je nog wilt oefenen. Je reflectie staat los van de score.')+`<section id="report"><p class="print-only"><b>Zonder woorden · Exit ticket non-verbale communicatie</b><br>Naam: __________________________________ &nbsp; Klas: ____________</p><div class="result-top"><div class="score">${score}<span>/5</span></div><div><div class="eyebrow" style="color:var(--lime);margin-bottom:10px">Poging ${r.attempt} · ${esc(r.date)}</div><h2>${secure?'Je hebt de kern goed in beeld.':'Je volgende leerstap is duidelijk.'}</h2><p>${secure?'Je herkent de meeste kernbegrippen en neemt de context mee.':'Gebruik de uitleg hieronder om je begrip verder te versterken.'}</p></div></div><div class="panel"><h2 style="font-size:24px">Dit laten je antwoorden zien.</h2>${quiz.map((q,i)=>`<div class="report-item"><span class="badge ${correct[i]?'':'review'}">${correct[i]?'✓ CORRECT':'↗ NOG OEFENEN'}</span><h3>${i+1}. ${q.q}</h3><p><b>Jouw antwoord:</b> ${esc(q.o[r.answers[i]])}</p>${correct[i]?'':`<p><b>Passend antwoord:</b> ${q.o[q.a]}</p>`}<p class="muted">${q.why}</p></div>`).join('')}<div class="report-item"><span class="badge">REFLECTIE · ZELFCONTROLE</span><h3>Welke extra informatie zou je vragen?</h3><p style="white-space:pre-wrap"><b>Jouw antwoord:</b> ${esc(r.reflection)}</p><div class="feedback"><strong>Vergelijk met dit voorbeeld.</strong>“Ik zou vragen wat er door je heen gaat of of je even tijd nodig hebt om na te denken. Wegkijken alleen vertelt mij niet waarom je dat doet.”<br><br>Check jezelf: stel je een open, niet-beschuldigende vraag? Zoek je extra context? Vermijd je een zekere conclusie over liegen of gevoelens?</div><p class="small muted">Deze reflectie is niet automatisch beoordeeld en telt niet mee voor de score op vijf.</p></div><div class="section"><h3>${weak.length?'Dit kun je gericht herhalen.':'Houd deze gewoonte vast.'}</h3><p class="small muted" style="margin-top:10px">${weak.length?weak.map(q=>q.topic).join(' · '):'Benoem eerst de observatie, bekijk de context en onderbouw dan een mogelijke betekenis.'}</p><div class="recommendations">${[...new Set(weak.map(q=>q.step))].map(i=>`<button class="btn secondary" data-nav="${i}">Herhaal: ${titles[i]}</button>`).join('')}</div></div></div><div class="actions no-print"><button class="btn" data-action="print">Afdrukken / bewaren als pdf ${icon('arrow')}</button><button class="btn secondary" data-modal="retry">Nog een keer oefenen</button></div><p class="small muted no-print" style="margin-top:14px">Alleen dit exit ticket wordt afgedrukt. Er worden geen antwoorden naar je leerkracht verstuurd.</p></section>`;}
function vocabList(term=''){const filtered=vocab.filter(v=>v.join(' ').toLocaleLowerCase('nl').includes(term.toLocaleLowerCase('nl')));return filtered.length?['Lichaamstaal','Stemtaal','Interpreteren'].map(g=>{const items=filtered.filter(v=>v[0]===g);return items.length?`<div class="vocab-group"><h3>${g}</h3><dl>${items.map(v=>`<dt>${v[1]}</dt><dd>${v[2]}</dd>`).join('')}</dl></div>`:'';}).join(''):'<p>Geen begrip gevonden. Probeer een korter zoekwoord.</p>';}
function openModal(type,word=''){const modal=document.getElementById('modal'),heading=document.getElementById('modal-title'),body=document.getElementById('modal-body');
if(type==='vocab'){heading.textContent='Woordenwijzer';body.innerHTML=`<label class="sr-only" for="vocab-search">Zoek een begrip</label><input class="vocab-search" id="vocab-search" type="search" placeholder="Zoek een begrip …" value="${esc(word)}"><div id="vocab-results">${vocabList(word)}</div>`;}
if(type==='help'){heading.textContent='Over deze les';body.innerHTML=`<h3>Zo werkt de leerroute</h3><p>Werk in je eigen tempo door de zes onderdelen. Een vinkje verschijnt wanneer je de bijbehorende opdrachten hebt afgerond. Je mag altijd vooruitgaan of terugkijken. De woordenwijzer blijft bereikbaar.</p><ul><li>Bij het oefenen krijg je hints en nieuwe pogingen.</li><li>In het exit ticket krijg je de uitleg na het indienen.</li><li>De vijf gesloten vragen tellen mee voor de score. De reflectie beoordeel je zelf met een voorbeeld.</li></ul><h3>Voortgang en privacy</h3><p>Deze app werkt zonder account en zonder internet voor de hoofdroute. Antwoorden worden waar mogelijk in deze browser op dit apparaat bewaard. Ze worden niet verstuurd. Op een gedeeld apparaat kun je onderaan “Opnieuw beginnen” kiezen. Privémodus, een andere browser of het verplaatsen van het bestand kan betekenen dat eerdere voortgang niet beschikbaar is.</p><h3>Voor de leerkracht</h3><p>Reken op ongeveer 45–50 minuten, afhankelijk van bespreking en verdieping. Leerlingen oefenen signalen herkennen, functies onderscheiden en interpretaties onderbouwen. De eerste indruk is ongescoord. Bij de scenario’s telt een juiste observatie én functie met onderbouwing.</p><p>De melding “de kern goed in beeld” verschijnt bij minstens 4/5 én een juist antwoord op de contextvraag. Dat is een formatieve aanwijzing; bespreek ook de open reflectie. Het resultaat is lokaal afdrukbaar en wordt niet automatisch verzameld.</p><h3>Bronmateriaal en bewerking</h3><p><b>Leerkrachtenbundel Functies van non-verbaal gedrag</b>, Mariagaarde secundair, aangeleverde pdf, 5 pagina’s. De acht functies en de oefencontexten vormen de basis. De dialoog is bewerkt; nieuwe klassituaties, de woordenwijzer en het exit ticket zijn toegevoegd.</p><p>Enkele interpretaties zijn genuanceerd: wegkijken bewijst geen leugen, functies kunnen samengaan en de ontwikkeling van liegen verloopt niet volgens een harde grens van drie jaar. De mediaopdrachten zijn gebaseerd op de beschrijvingen in de bundel; het fragment is niet onafhankelijk bekeken bij het samenstellen van deze app.</p><ul><li><a href="https://onderwijs.hetarchief.be/item/4j09w48c9j" target="_blank" rel="noopener">De Wonderjaren · link uit de bundel</a></li><li><a href="https://researchportal.port.ac.uk/files/13540389/Reading_Lies.pdf" target="_blank" rel="noopener">Vrij, Hartwig & Granhag (2019), Reading Lies: Nonverbal Communication and Deception</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3788848/" target="_blank" rel="noopener">Evans & Lee (2013), Emergence of Lying in Very Young Children</a></li></ul><p class="muted">Alle illustraties zijn schematische, zelfgemaakte gespreksscènes. De beschreven context bepaalt hoe je ze in de oefening interpreteert.</p>`;}
if(type==='reset'){heading.textContent='Een nieuwe start?';body.innerHTML='<p>Dit wist alle antwoorden en je exit ticket in deze browser. Bewaar je resultaat eerst als je het nog nodig hebt.</p><div class="actions"><button class="btn" data-action="reset">Ja, begin opnieuw</button><button class="btn secondary" data-action="close">Bewaar mijn voortgang</button></div>';}
if(type==='retry'){heading.textContent='Nog een poging';body.innerHTML='<p>Je huidige exit ticket wordt vervangen zodra je opnieuw oefent. Bewaar het eerst als je de pogingen wilt vergelijken. Je voortgang in de andere oefeningen blijft bewaard.</p><div class="actions"><button class="btn" data-action="retry">Start een nieuwe poging</button><button class="btn secondary" data-action="close">Terug naar mijn resultaat</button></div>';}
modal.showModal();if(type==='vocab')document.getElementById('vocab-search').focus();}
document.getElementById('close-modal').addEventListener('click',()=>document.getElementById('modal').close());
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
if(el.dataset.nav!==undefined){navigate(Number(el.dataset.nav));return;}
if(el.dataset.modal){openModal(el.dataset.modal);return;}
if(el.dataset.word){openModal('vocab',el.dataset.word);return;}
const a=el.dataset.action,k=Number(el.dataset.key),v=Number(el.dataset.value);if(!a)return;
if(a==='close'){document.getElementById('modal').close();return;}
if(a==='print'){window.print();return;}
if(a==='reset'){document.getElementById('modal').close();state=fresh();selectedMatch=null;matchFeedback=dialogueFeedback=scenarioFeedback=quizError='';save();navigate(0);say('Alle voortgang is gewist. Je kunt opnieuw beginnen.');return;}
if(a==='retry'){document.getElementById('modal').close();state.result=null;state.quizAnswers={};state.reflection='';quizError='';save();navigate(5);return;}
if(a==='jump-start'){document.getElementById('first-impression').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('start-0-0').focus({preventScroll:true});return;}
if(a==='start')state.startChoice=v;
if(a==='reveal'){state.revealed=true;say('Extra context: het raam staat open en Alex zegt dat het koud is.');}
if(a==='learn'){state.learnOpen=k;state.learnChoice[k]=v;state.learn[k]=v===functionsData[k].answer;say(v===functionsData[k].answer?'Goed gezien. '+functionsData[k].why: functionsData[k].hint);}
if(a==='round'){state.round=v;selectedMatch=null;matchFeedback='';}
if(a==='match-case'){selectedMatch=v;matchFeedback='';say('Situatie '+(v+1)+' geselecteerd. Kies nu een functie.');}
if(a==='match-target'){
if(selectedMatch===null){matchFeedback=feed('Klik eerst op een situatie aan de linkerkant.','hint','Kies eerst een situatie.');}
else if(matches[selectedMatch].f===v){const idx=selectedMatch;state.matched.push(idx);matchFeedback=feed(matches[idx].hint);selectedMatch=null;say('Juiste koppeling. '+matches[idx].hint);}
else{matchFeedback=feed(matches[selectedMatch].hint,'hint','Nog niet de beste match.');say('Nog niet de beste match. '+matches[selectedMatch].hint);}}
if(a==='check-gaps'){state.gapChecked=true;say(gaps.filter((g,i)=>state.gaps[i]===g.word).length+' van 8 antwoorden correct. Bekijk de uitleg onder elk antwoord.');}
if(a==='gesture'){state.dialogueActive=v;dialogueFeedback='';}
if(a==='dialogue'){state.dialogueChoice[k]=v;state.dialogue[k]=v===dialogue[k].answer;dialogueFeedback=v===dialogue[k].answer?feed(dialogue[k].why):feed(dialogue[k].hint,'hint','Kijk nog eens naar de situatie.');say(v===dialogue[k].answer?dialogue[k].why:dialogue[k].hint);}
if(a==='scenario'){state.scenario=v;scenarioFeedback='';}
if(a==='observation'){state.observations[k]=v;delete state.scenarioChecked[k];scenarioFeedback='';}
if(a==='interpretation'){if(scenarios[k].answers.length>1){const arr=state.interpretations[k]||[];state.interpretations[k]=arr.includes(v)?arr.filter(n=>n!==v):[...arr,v];}else state.interpretations[k]=[v];delete state.scenarioChecked[k];scenarioFeedback='';}
if(a==='check-scenario'){const i=state.scenario,s=scenarios[i];if(state.observations[i]===undefined||!state.interpretations[i]?.length){scenarioFeedback=feed('Kies een observatie en een functie met onderbouwing. Bij situatie 3 kies je twee functies.','hint','Maak beide stappen af.');}else{state.scenarioChecked[i]=true;scenarioFeedback=scenarioCorrect(i)?feed(s.why):feed(s.hint,'hint','Je redenering is nog niet helemaal juist.');}say(scenarioCorrect(i)?s.why:s.hint);}
save();render();
if(a==='gesture'&&matchMedia('(max-width:700px)').matches){document.getElementById('dialogue-question').scrollIntoView({block:'start',behavior:'smooth'});document.getElementById(`dialogue-${state.dialogueActive}-0`).focus({preventScroll:true});}
});
document.addEventListener('change',e=>{if(e.target.dataset.gap!==undefined){state.gaps[Number(e.target.dataset.gap)]=e.target.value;save();if(state.gapChecked)render();}if(e.target.name?.startsWith('quiz-')){state.quizAnswers[Number(e.target.name.slice(5))]=Number(e.target.value);save();}});
document.addEventListener('input',e=>{if(e.target.id==='reflection'){state.reflection=e.target.value;save();}if(e.target.id==='vocab-search'){document.getElementById('vocab-results').innerHTML=vocabList(e.target.value);}});
document.addEventListener('toggle',e=>{if(e.target.matches?.('details[data-learn]')&&e.target.open){state.learnOpen=Number(e.target.dataset.learn);save();}},true);
document.addEventListener('submit',e=>{if(e.target.id!=='exit-form')return;e.preventDefault();const missing=quiz.findIndex((q,i)=>!Number.isInteger(state.quizAnswers[i]));if(missing!==-1||!state.reflection.trim()){quizError=missing!==-1?'Beantwoord alle vijf keuzevragen. Je mist nog vraag '+(missing+1)+'.':'Schrijf nog je korte reflectie. Die telt niet mee voor je score.';render();say(quizError);if(missing!==-1)document.querySelector(`[name="quiz-${missing}"]`).focus();else document.getElementById('reflection').focus();return;}state.attempts++;state.result={answers:{...state.quizAnswers},reflection:state.reflection.trim(),attempt:state.attempts,date:new Intl.DateTimeFormat('nl-BE',{day:'numeric',month:'long',year:'numeric'}).format(new Date())};quizError='';save();render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});say('Je exit ticket is ingediend. Je score is '+quiz.filter((q,i)=>state.result.answers[i]===q.a).length+' op 5.');});
render();save();
</script>
</body>
</html>
